<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#142d4e">
<title>EduGrade — система оценивания</title>
<style>
:root{--navy:#142d4e;--navy2:#203f63;--teal:#21a6a0;--teal-light:#e5f6f4;--coral:#ef8d83;--cream:#f7f6f1;--paper:#fff;--ink:#203047;--muted:#718096;--line:#e7ebef;--green:#23866e;--red:#c45c5c;--shadow:0 8px 28px rgba(22,43,69,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:var(--navy);color:#fff;padding:25px 16px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--teal);display:grid;place-items:center;font-weight:900;font-size:19px}.brand-name{font-size:20px;font-weight:800;letter-spacing:-.5px}.brand small{display:block;color:#a9bed1;font-size:10px;letter-spacing:1.5px;margin-top:2px}.nav-label{font-size:10px;color:#91a9bf;text-transform:uppercase;letter-spacing:1.5px;padding:0 12px;margin-bottom:7px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#cbd7e2;text-align:left;padding:12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:13px}.nav button:hover,.nav button.active{background:#294765;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;padding:14px 12px;color:#b3c4d3;font-size:11px;line-height:1.6;border-top:1px solid #34506b}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.crumb{font-size:13px;color:var(--muted)}.crumb strong{color:var(--ink)}.profile{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700}.avatar{width:36px;height:36px;border-radius:50%;background:#e2f2f1;color:#16837e;display:grid;place-items:center;font-weight:800}.content{max-width:1450px;margin:auto;padding:30px 34px 60px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.eyebrow{color:var(--teal);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.6px}.page-head h1{font-size:27px;letter-spacing:-.8px;margin:6px 0}.sub{color:var(--muted);font-size:13px}.btn{border:0;border-radius:9px;padding:10px 15px;font-size:12px;font-weight:750;display:inline-flex;align-items:center;gap:7px}.primary{background:var(--teal);color:#fff}.primary:hover{background:#168e89}.secondary{background:#edf2f5;color:var(--navy)}.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0ef;color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat,.panel,.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:18px 19px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.stat-icon{width:31px;height:31px;border-radius:9px;background:var(--teal-light);display:grid;place-items:center;color:var(--teal);font-size:15px}.stat strong{display:block;font-size:27px;margin:9px 0 3px;letter-spacing:-1px}.stat small{font-size:11px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}.panel{padding:20px;margin-bottom:16px}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.panel-title h3{margin:0;font-size:14px}.panel-title span{font-size:11px;color:var(--muted)}.bar-list{display:grid;gap:15px}.bar-row{display:grid;grid-template-columns:120px 1fr 40px;align-items:center;gap:10px;font-size:11px}.track{height:8px;background:#edf1f3;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--teal);border-radius:99px}.fill.coral{background:var(--coral)}.fill.blue{background:#668db8}.notice{padding:13px 15px;background:#fff8ed;border:1px solid #f5e5c8;border-radius:10px;color:#856334;font-size:12px;line-height:1.55}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{border-collapse:collapse;width:100%;min-width:650px;background:#fff}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}th{background:#f8fafb;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fbfdfd}.grade{display:inline-grid;place-items:center;min-width:31px;height:27px;border-radius:7px;background:#e8f6f2;color:#237c69;font-weight:800}.grade.mid{background:#fff3e3;color:#a36b24}.grade.low{background:#fff0ef;color:#bd5b56}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#edf5f5;color:#31817c;font-size:10px;font-weight:800}.tag.coral{background:#fff0ed;color:#bb6c62}.tag.blue{background:#edf2fa;color:#587aa6}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:11px;color:#607084;font-weight:750}.field input,.field select,.field textarea,.filters input,.filters select{border:1px solid #dfe6eb;border-radius:8px;padding:10px 11px;background:#fff;color:var(--ink);outline:none;font-size:12px;min-width:0}.field input:focus,.field select:focus,.field textarea:focus,.filters input:focus,.filters select:focus{border-color:var(--teal);box-shadow:0 0 0 3px #21a6a018}.filters input,.filters select{min-width:150px}.empty{padding:32px;text-align:center;color:var(--muted);font-size:12px}.student-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.student-card{border:1px solid var(--line);border-radius:12px;padding:15px;background:#fff}.student-card-top{display:flex;align-items:center;gap:10px;margin-bottom:13px}.student-card .avatar{width:38px;height:38px}.student-card strong{font-size:12px}.student-card small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.student-meta{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:11px;font-size:10px;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:#142d4e80;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-backdrop.show{display:flex}.modal{background:#fff;border-radius:16px;width:min(540px,100%);max-height:90vh;overflow:auto;padding:23px;box-shadow:0 20px 70px #0003}.modal h2{font-size:18px;margin:0 0 5px}.modal .muted{font-size:11px;color:var(--muted);margin-bottom:18px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.criteria-row{display:grid;grid-template-columns:1fr 90px;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.criteria-row label{font-size:12px}.criteria-row small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.criteria-row input{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px}.total-line{display:flex;justify-content:space-between;padding:13px;background:#f1f8f7;border-radius:9px;font-size:12px;font-weight:800;margin-top:13px}.student-view{max-width:850px}.student-hero{background:linear-gradient(120deg,#142d4e,#275574);color:#fff;border-radius:16px;padding:25px;margin-bottom:16px}.student-hero .eyebrow{color:#7ee0d5}.student-hero h2{margin:8px 0;font-size:23px}.student-hero p{color:#d1dfeb;font-size:12px}.student-hero .avatar{background:#e2f2f1}.student-grade-list{display:grid;gap:9px}.student-grade{display:flex;align-items:center;justify-content:space-between;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:12px}.student-grade small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.toast{position:fixed;right:22px;bottom:22px;background:#173b55;color:#fff;padding:12px 16px;border-radius:10px;font-size:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.25s;z-index:40}.toast.show{opacity:1;transform:translateY(0)}.mobile-menu{display:none}
@media(max-width:950px){.app{grid-template-columns:205px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.student-list{grid-template-columns:repeat(2,1fr)}.content{padding:24px 20px}}
@media(max-width:650px){.app{display:block}.sidebar{position:fixed;z-index:15;left:-260px;top:0;bottom:0;width:248px;transition:.25s}.sidebar.open{left:0}.mobile-menu{display:inline-flex}.topbar{height:62px;padding:0 16px}.content{padding:22px 14px 45px}.page-head{align-items:flex-start}.page-head h1{font-size:23px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.student-list{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.profile span{display:none}.page-head .btn{font-size:10px;padding:9px}.bar-row{grid-template-columns:95px 1fr 35px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="brand-mark">E</div><div class="brand-name">EduGrade<small>SMART ASSESSMENT</small></div></div>
 <div><div class="nav-label">Рабочее пространство</div><nav class="nav" id="nav">
  <button class="active" data-page="dashboard"><span class="ico">▦</span>Главная</button>
  <button data-page="students"><span class="ico">♙</span>Ученики</button>
  <button data-page="journal"><span class="ico">▤</span>Электронный журнал</button>
  <button data-page="assessments"><span class="ico">✓</span>Оценивание</button>
  <button data-page="analytics"><span class="ico">▥</span>Аналитика</button>
 </nav></div>
 <div><div class="nav-label">Личный кабинет</div><nav class="nav"><button data-page="student"><span class="ico">◎</span>Кабинет ученика</button></nav></div>
 <div class="side-bottom">EduGrade · версия 1.0<br>Демонстрационный образовательный проект</div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn secondary mobile-menu" id="menuBtn">☰</button><div class="crumb">EduGrade <span style="color:#b5c0ca"> / </span><strong id="crumb">Главная</strong></div></div><div class="profile"><div class="avatar">УЧ</div><span>Учитель · Русский язык</span></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
const seedStudents=[
{id:1,name:"Алина Садыкова",className:"7 «А»",email:"alina.demo@edugrade.kz"},
{id:2,name:"Дамир Ермеков",className:"7 «А»",email:"damir.demo@edugrade.kz"},
{id:3,name:"Мадина Нурланова",className:"7 «А»",email:"madina.demo@edugrade.kz"},
{id:4,name:"Арман Толеуов",className:"7 «А»",email:"arman.demo@edugrade.kz"},
{id:5,name:"София Ким",className:"7 «А»",email:"sofia.demo@edugrade.kz"},
{id:6,name:"Алихан Беков",className:"7 «А»",email:"alikhan.demo@edugrade.kz"},
{id:7,name:"Диана Омарова",className:"7 «А»",email:"diana.demo@edugrade.kz"},
{id:8,name:"Ерасыл Мусин",className:"7 «А»",email:"yerasyl.demo@edugrade.kz"}
];
const seedAssessments=[
{id:101,title:"Определение темы и главной мысли текста",type:"ФО",date:"2026-11-12",max:10,criteria:[{name:"Определяет тему текста",desc:"Формулирует тему кратко и точно",max:3},{name:"Находит главную мысль",desc:"Выделяет основную идею текста",max:4},{name:"Аргументирует ответ",desc:"Подкрепляет ответ примером",max:3}]},
{id:102,title:"Имя существительное: СОР № 1",type:"СОР",date:"2026-11-14",max:15,criteria:[{name:"Распознаёт существительные",desc:"Находит существительные в тексте",max:5},{name:"Определяет грамматические признаки",desc:"Указывает род, число и падеж",max:5},{name:"Применяет правила",desc:"Выполняет задания без ошибок",max:5}]},
{id:103,title:"Работа с художественным текстом",type:"ФО",date:"2026-11-17",max:10,criteria:[{name:"Понимание содержания",desc:"Отвечает на вопросы по тексту",max:4},{name:"Анализ образов",desc:"Характеризует героев",max:3},{name:"Связная речь",desc:"Строит логичный ответ",max:3}]}
];
const seedScores=[
[101,1,9],[101,2,7],[101,3,10],[101,4,6],[101,5,9],[101,6,8],[101,7,10],[101,8,7],
[102,1,14],[102,2,11],[102,3,15],[102,4,9],[102,5,13],[102,6,12],[102,7,14],[102,8,10],
[103,1,8],[103,2,7],[103,3,9],[103,4,6],[103,5,10],[103,6,8],[103,7,9],[103,8,7]
].map(([assessmentId,studentId,score])=>({assessmentId,studentId,score,feedback:"Хорошая работа! Продолжай развивать навыки."}));
let state;
function load(){try{const s=JSON.parse(localStorage.getItem("edugrade_state"));if(s)return s}catch(e){}return{students:seedStudents,assessments:seedAssessments,scores:seedScores,selectedStudent:1}}
function save(){localStorage.setItem("edugrade_state",JSON.stringify(state))}
state=load();
const pages={dashboard:"Главная",students:"Ученики",journal:"Электронный журнал",assessments:"Оценивание",analytics:"Аналитика",student:"Кабинет ученика"};
let currentPage="dashboard";
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function avg(){if(!state.scores.length)return 0;return state.scores.reduce((a,x)=>a+x.score,0)/state.scores.length}
function scoreFor(aid,sid){return state.scores.find(s=>s.assessmentId===aid&&s.studentId===sid)}
function pct(score,max){return max?Math.round(score/max*100):0}
function gradeClass(p){return p>=75?"":p>=50?"mid":"low"}
function initials(n){return n.split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase()}
function dateFmt(d){return new Date(d+"T00:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"short",year:"numeric"})}
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2400)}
function setPage(p){currentPage=p;$("#crumb").textContent=pages[p];document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("#sidebar").classList.remove("open");render()}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
$("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("open");
function head(kicker,title,sub,action=""){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><div class="sub">${sub}</div></div>${action}</div>`}
function stat(label,value,desc,icon){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><strong>${value}</strong><small>${desc}</small></div>`}
function dashboard(){let students=state.students.length,ass=state.assessments.length,mean=avg(),percent=state.scores.length?Math.round(state.scores.reduce((a,s)=>{let x=state.assessments.find(v=>v.id===s.assessmentId);return a+(x?pct(s.score,x.max):0)},0)/state.scores.length):0;
let recent=state.assessments.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
let rows=recent.map(a=>`<tr><td><strong>${esc(a.title)}</strong></td><td><span class="tag ${a.type==="СОР"?"coral":a.type==="СОЧ"?"blue":""}">${a.type}</span></td><td>${dateFmt(a.date)}</td><td>${a.max}</td><td><button class="btn secondary" onclick="openAssessment(${a.id})">Открыть</button></td></tr>`).join("");
return head("ПАНЕЛЬ УПРАВЛЕНИЯ","Добро пожаловать в EduGrade","Ваше пространство для прозрачного и удобного оценивания.")+
`<div class="stats">${stat("УЧЕНИКИ",students,"В демонстрационном классе","♙")}${stat("РАБОТЫ",ass,"Создано оцениваний","▤")}${stat("СРЕДНИЙ БАЛЛ",mean.toFixed(1),"Баллов за все работы","★")}${stat("СРЕДНИЙ РЕЗУЛЬТАТ",percent+"%","От максимального балла","↗")}</div>
<div class="grid2"><section class="panel"><div class="panel-title"><h3>Последние оценивания</h3><button class="btn secondary" onclick="setPage('assessments')">Все работы →</button></div><div class="table-wrap"><table><thead><tr><th>Работа</th><th>Тип</th><th>Дата</th><th>Макс.</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="empty">Оцениваний пока нет</td></tr>`}</tbody></table></div></section>
<section class="panel"><div class="panel-title"><h3>Успеваемость класса</h3><span>Средний процент по ученикам</span></div><div class="bar-list">${state.students.slice(0,6).map(st=>{let ss=state.scores.filter(s=>s.studentId===st.id);let p=ss.length?Math.round(ss.reduce((z,s)=>{let a=state.assessments.find(a=>a.id===s.assessmentId);return z+(a?pct(s.score,a.max):0)},0)/ss.length):0;return `<div class="bar-row"><span>${esc(st.name.split(" ")[0])}</span><div class="track"><div class="fill" style="width:${p}%"></div></div><b>${p}%</b></div>`}).join("")}</div></section></div>
<div class="notice">✦ <b>Подсказка:</b> создайте оценивание, добавьте критерии и дескрипторы, затем внесите баллы учеников. EduGrade автоматически рассчитает проценты и покажет результаты в личном кабинете.</div>`
}
function studentsPage(){return head("КЛАСС","Ученики","Демонстрационный список учащихся · 7 «А»",`<button class="btn primary" onclick="studentModal()">＋ Добавить ученика</button>`)+
`<div class="filters"><input id="studentSearch" placeholder="Поиск ученика..." oninput="filterStudents()"><select id="classFilter" onchange="filterStudents()"><option value="">Все классы</option>${[...new Set(state.students.map(s=>s.className))].map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><div class="student-list" id="studentList">${studentCards(state.students)}</div>`}
function studentCards(list){return list.map(st=>{let ss=state.scores.filter(s=>s.studentId===st.id),mean=ss.length? (ss.reduce((a,x)=>a+x.score,0)/ss.length).toFixed(1):"—";return `<div class="student-card"><div class="student-card-top"><div class="avatar">${initials(st.name)}</div><div><strong>${esc(st.name)}</strong><small>${esc(st.className)} · Ученик</small></div></div><div class="student-meta"><span>Средний балл</span><b>${mean}</b></div><div style="display:flex;gap:7px;margin-top:12px"><button class="btn secondary" onclick="selectStudent(${st.id});setPage('student')">Профиль</button><button class="btn outline" onclick="editStudent(${st.id})">Изменить</button></div></div>`}).join("")||`<div class="empty">Ученики не найдены</div>`}
function filterStudents(){let q=$("#studentSearch").value.toLowerCase(),c=$("#classFilter").value;$("#studentList").innerHTML=studentCards(state.students.filter(s=>s.name.toLowerCase().includes(q)&&(!c||s.className===c)))}
function journalPage(){return head("ЖУРНАЛ","Электронный журнал","Сводная таблица результатов по всем оцениваниям.")+
`<div class="filters"><input id="journalSearch" placeholder="Найти ученика..." oninput="filterJournal()"><select id="journalType" onchange="filterJournal()"><option value="">Все типы работ</option><option>ФО</option><option>СОР</option><option>СОЧ</option></select></div><div class="panel"><div class="table-wrap" id="journalTable">${journalTable(state.students,state.assessments)}</div></div><div class="notice">Баллы и проценты отображаются по каждой работе отдельно. Изменить результат можно в разделе «Оценивание».</div>`}
function journalTable(students,assessments){return `<table><thead><tr><th>Ученик</th>${assessments.map(a=>`<th title="${esc(a.title)}">${esc(a.type)} · ${esc(a.title.slice(0,16))}${a.title.length>16?"…":""}<br><small>из ${a.max}</small></th>`).join("")}<th>Средний %</th></tr></thead><tbody>${students.map(st=>{let ps=assessments.map(a=>{let s=scoreFor(a.id,st.id);return s?pct(s.score,a.max):null});let done=ps.filter(x=>x!==null),m=done.length?Math.round(done.reduce((x,y)=>x+y,0)/done.length):null;return `<tr><td><b>${esc(st.name)}</b><br><small style="color:#8290a0">${esc(st.className)}</small></td>${assessments.map((a,i)=>{let s=scoreFor(a.id,st.id);return `<td>${s?`<span class="grade ${gradeClass(pct(s.score,a.max))}">${s.score}</span>`:`<span style="color:#aab4bd">—</span>`}</td>`}).join("")}<td><b>${m===null?"—":m+"%"}</b></td></tr>`}).join("")}</tbody></table>`}
function filterJournal(){let q=$("#journalSearch").value.toLowerCase(),t=$("#journalType").value;let as=state.assessments.filter(a=>!t||a.type===t);$("#journalTable").innerHTML=journalTable(state.students.filter(s=>s.name.toLowerCase().includes(q)),as)}
function assessmentsPage(){return head("КРИТЕРИАЛЬНОЕ ОЦЕНИВАНИЕ","Оценивания","Создавайте ФО, СОР и СОЧ с критериями и дескрипторами.",`<button class="btn primary" onclick="assessmentModal()">＋ Создать оценивание</button>`)+
`<div class="filters"><select id="assessmentFilter" onchange="filterAssessments()"><option value="">Все виды</option><option>ФО</option><option>СОР</option><option>СОЧ</option></select></div><div id="assessmentList" class="panel">${assessmentCards(state.assessments)}</div>`}
function assessmentCards(list){return list.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<div style="padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center"><div style="min-width:0"><div style="display:flex;gap:8px;align-items:center;margin-bottom:7px"><span class="tag ${a.type==="СОР"?"coral":a.type==="СОЧ"?"blue":""}">${a.type}</span><small style="color:var(--muted)">${dateFmt(a.date)}</small></div><b style="font-size:13px">${esc(a.title)}</b><div style="font-size:10px;color:var(--muted);margin-top:5px">${a.criteria.length} критерия · максимум ${a.max} баллов</div></div><div style="display:flex;gap:7px;flex-shrink:0"><button class="btn primary" onclick="openAssessment(${a.id})">Оценить</button><button class="btn outline" onclick="editAssessment(${a.id})">✎</button></div></div>`).join("")||`<div class="empty">Оцениваний пока нет. Создайте первое.</div>`}
function filterAssessments(){let t=$("#assessmentFilter").value;$("#assessmentList").innerHTML=assessmentCards(state.assessments.filter(a=>!t||a.type===t))}
function analyticsPage(){let scored=state.scores.map(s=>({s,a:state.assessments.find(a=>a.id===s.assessmentId)})).filter(x=>x.a);let counts=["ФО","СОР","СОЧ"].map(t=>({t,n:state.assessments.filter(a=>a.type===t).length}));let distribution=state.students.map(st=>{let ss=state.scores.filter(s=>s.studentId===st.id);let p=ss.length?Math.round(ss.reduce((z,s)=>{let a=state.assessments.find(a=>a.id===s.assessmentId);return z+(a?pct(s.score,a.max):0)},0)/ss.length):0;return{st,p}});return head("АНАЛИТИКА","Результаты и прогресс","Обзор успеваемости демонстрационного класса.")+
`<div class="stats">${stat("ВЫСТАВЛЕНО БАЛЛОВ",state.scores.length,"Записей в журнале","✓")}${stat("СРЕДНИЙ БАЛЛ",avg().toFixed(1),"По всем работам","★")}${stat("ФО",counts[0].n,"Формативных оцениваний","◎")}${stat("СОР И СОЧ",counts[1].n+counts[2].n,"Суммативных работ","▤")}</div>
<div class="grid2"><section class="panel"><div class="panel-title"><h3>Средний процент по ученикам</h3></div><div class="bar-list">${distribution.map(x=>`<div class="bar-row"><span>${esc(x.st.name.split(" ")[0])}</span><div class="track"><div class="fill ${x.p<50?"coral":""}" style="width:${x.p}%"></div></div><b>${x.p}%</b></div>`).join("")}</div></section><section class="panel"><div class="panel-title"><h3>Виды оценивания</h3></div>${counts.map(x=>`<div style="display:flex;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line);font-size:12px"><span>${x.t==="ФО"?"Формативное оценивание":x.t==="СОР"?"Суммативное за раздел":"Суммативное за четверть"}</span><b>${x.n}</b></div>`).join("")}<div style="font-size:10px;color:var(--muted);margin-top:12px">Данные обновляются автоматически при внесении результатов.</div></section></div>
<div class="panel"><div class="panel-title"><h3>Итоги по оцениваниям</h3></div><div class="table-wrap"><table><thead><tr><th>Работа</th><th>Тип</th><th>Средний результат</th><th>Выполнено</th></tr></thead><tbody>${state.assessments.map(a=>{let ss=state.scores.filter(s=>s.assessmentId===a.id),m=ss.length?Math.round(ss.reduce((z,s)=>z+pct(s.score,a.max),0)/ss.length):0;return `<tr><td>${esc(a.title)}</td><td>${a.type}</td><td>${ss.length?m+"%":"—"}</td><td>${ss.length}/${state.students.length}</td></tr>`}).join("")}</tbody></table></div></div>`}
function studentPage(){let st=state.students.find(s=>s.id===state.selectedStudent)||state.students[0];if(!st)return head("КАБИНЕТ УЧЕНИКА","Нет учеников","Добавьте ученика в список.");let scores=state.scores.filter(s=>s.studentId===st.id).map(s=>({...s,a:state.assessments.find(a=>a.id===s.assessmentId)})).filter(s=>s.a).sort((a,b)=>b.a.date.localeCompare(a.a.date));let p=scores.length?Math.round(scores.reduce((z,s)=>z+pct(s.score,s.a.max),0)/scores.length):0;return `<div class="student-view">${head("ЛИЧНЫЙ КАБИНЕТ","Мои результаты","Демонстрационный режим · просмотр успеваемости.")}<div class="filters"><label style="font-size:11px;align-self:center">Ученик:</label><select onchange="selectStudent(Number(this.value));render()">${state.students.map(s=>`<option value="${s.id}" ${s.id===st.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select></div><div class="student-hero"><div class="avatar">${initials(st.name)}</div><h2>${esc(st.name)}</h2><p>${esc(st.className)} · Личный кабинет ученика</p><div style="display:flex;gap:30px;margin-top:20px"><div><div style="font-size:25px;font-weight:800">${p}%</div><small style="color:#d1dfeb">Средний результат</small></div><div><div style="font-size:25px;font-weight:800">${scores.length}</div><small style="color:#d1dfeb">Оцениваний</small></div></div></div><section class="panel"><div class="panel-title"><h3>Мои оценки</h3><span>Последние результаты</span></div><div class="student-grade-list">${scores.map(s=>`<div class="student-grade"><div><b>${esc(s.a.title)}</b><small>${s.a.type} · ${dateFmt(s.a.date)}</small>${s.feedback?`<small>Комментарий: ${esc(s.feedback)}</small>`:""}</div><div style="text-align:right"><b style="font-size:17px">${s.score}/${s.a.max}</b><small>${pct(s.score,s.a.max)}%</small></div></div>`).join("")||`<div class="empty">Пока нет выставленных оценок</div>`}</div></section></div>`}
function render(){let views={dashboard,students:studentsPage,journal:journalPage,assessments:assessmentsPage,analytics:analyticsPage,student:studentPage};$("#content").innerHTML=views[currentPage]()}
function showModal(content){$("#modal").innerHTML=content;$("#modalBackdrop").classList.add("show")}
function closeModal(){$("#modalBackdrop").classList.remove("show")}
$("#modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal()});
function studentModal(id=null){let st=id?state.students.find(s=>s.id===id):null;showModal(`<h2>${st?"Редактировать ученика":"Добавить ученика"}</h2><div class="muted">Заполните информацию об учащемся.</div><form id="studentForm"><div class="field"><label>Фамилия и имя</label><input name="name" required value="${esc(st?.name||"")}" placeholder="Например, Алия Сейтова"></div><div class="field"><label>Класс</label><input name="className" required value="${esc(st?.className||"7 «А»")}"></div><div class="field"><label>Демо-почта (необязательно)</label><input name="email" type="email" value="${esc(st?.email||"")}" placeholder="student@example.kz"></div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn primary">Сохранить</button></div></form>`);$("#studentForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),data={name:f.get("name").trim(),className:f.get("className").trim(),email:f.get("email").trim()};if(st)Object.assign(st,data);else state.students.push({id:Date.now(),...data});save();closeModal();render();toast("Данные ученика сохранены")}}
function editStudent(id){studentModal(id)}
function selectStudent(id){state.selectedStudent=id;save()}
function assessmentModal(id=null){let a=id?state.assessments.find(x=>x.id===id):null;let criteria=a?a.criteria:[{name:"Критерий 1",desc:"Опишите ожидаемый результат",max:2},{name:"Критерий 2",desc:"Опишите ожидаемый результат",max:2}];showModal(`<h2>${a?"Редактировать оценивание":"Новое оценивание"}</h2><div class="muted">Укажите тип работы и критерии оценивания.</div><form id="assessmentForm"><div class="form-grid"><div class="field"><label>Название работы</label><input name="title" required value="${esc(a?.title||"")}" placeholder="Например, Анализ текста"></div><div class="field"><label>Тип оценивания</label><select name="type"><option ${a?.type==="ФО"?"selected":""}>ФО</option><option ${a?.type==="СОР"?"selected":""}>СОР</option><option ${a?.type==="СОЧ"?"selected":""}>СОЧ</option></select></div><div class="field"><label>Дата</label><input name="date" type="date" required value="${a?.date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Максимальный балл</label><input name="max" id="assessmentMax" type="number" min="1" required value="${a?.max||4}"></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin:9px 0"><b style="font-size:12px">Критерии и дескрипторы</b><button type="button" class="btn secondary" onclick="addCriterion()">＋ Критерий</button></div><div id="criteriaEditor">${criteria.map((c,i)=>criterionEditor(c,i)).join("")}</div><div class="notice" style="margin-top:12px">Максимальный балл работы должен совпадать с суммой баллов по критериям.</div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn primary">Сохранить</button></div></form>`);$("#assessmentForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),cs=[...document.querySelectorAll(".criteria-edit")].map(el=>({name:el.querySelector(".cname").value.trim(),desc:el.querySelector(".cdesc").value.trim(),max:Number(el.querySelector(".cmax").value)}));let max=Number(f.get("max"));if(!cs.length||cs.some(c=>!c.name||c.max<1)||cs.reduce((z,c)=>z+c.max,0)!==max){toast("Проверьте критерии: сумма их баллов должна равняться максимуму");return}let data={title:f.get("title").trim(),type:f.get("type"),date:f.get("date"),max,criteria:cs};if(a){Object.assign(a,data);state.scores=state.scores.filter(s=>s.assessmentId!==a.id||s.score<=max)}else state.assessments.push({id:Date.now(),...data});save();closeModal();render();toast("Оценивание сохранено")}}
function criterionEditor(c,i){return `<div class="criteria-edit" style="border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:11px">Критерий ${i+1}</b><button type="button" class="btn danger" style="padding:4px 8px" onclick="this.closest('.criteria-edit').remove()">Удалить</button></div><input class="cname" style="width:100%;margin:8px 0 6px;padding:8px;border:1px solid var(--line);border-radius:7px" value="${esc(c.name)}" placeholder="Название критерия"><input class="cdesc" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:7px" value="${esc(c.desc)}" placeholder="Дескриптор"><div style="display:flex;align-items:center;gap:8px;margin-top:7px;font-size:10px">Максимум баллов: <input class="cmax" type="number" min="1" value="${c.max}" style="width:65px;padding:6px;border:1px solid var(--line);border-radius:6px"></div></div>`}
function addCriterion(){let el=$("#criteriaEditor"),i=el.children.length;el.insertAdjacentHTML("beforeend",criterionEditor({name:"Новый критерий",desc:"Опишите ожидаемый результат",max:1},i))}
function editAssessment(id){assessmentModal(id)}
function openAssessment(id){let a=state.assessments.find(x=>x.id===id);if(!a)return;showModal(`<h2>${esc(a.title)}</h2><div class="muted">${a.type} · ${dateFmt(a.date)} · максимум ${a.max} баллов</div><div class="field"><label>Выберите ученика</label><select id="scoreStudent">${state.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div><div id="scoreInputs">${scoreInputs(a,state.students[0]?.id)}</div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Закрыть</button><button class="btn primary" onclick="saveScore(${a.id})">Сохранить результат</button></div>`);$("#scoreStudent").onchange=e=>{$("#scoreInputs").innerHTML=scoreInputs(a,Number(e.target.value))}}
function scoreInputs(a,sid){let old=scoreFor(a.id,sid);return `<div class="field"><label>Набранный балл (из ${a.max})</label><input id="scoreValue" type="number" min="0" max="${a.max}" value="${old?.score??""}" placeholder="Введите результат"></div><div class="field"><label>Комментарий ученику</label><textarea id="scoreFeedback" rows="2" placeholder="Обратная связь...">${esc(old?.feedback||"")}</textarea></div><div style="background:#f7fafb;padding:12px;border-radius:9px;font-size:11px;color:var(--muted)"><b>Критерии:</b>${a.criteria.map(c=>`<div style="display:flex;justify-content:space-between;margin-top:7px"><span>${esc(c.name)} <small>— ${esc(c.desc)}</small></span><b>${c.max} б.</b></div>`).join("")}</div>`}
function saveScore(aid){let sid=Number($("#scoreStudent").value),a=state.assessments.find(x=>x.id===aid),v=Number($("#scoreValue").value);if($("#scoreValue").value===""||!Number.isFinite(v)||v<0||v>a.max){toast("Введите корректный балл от 0 до "+a.max);return}let old=scoreFor(aid,sid);if(old){old.score=v;old.feedback=$("#scoreFeedback").value.trim()}else state.scores.push({assessmentId:aid,studentId:sid,score:v,feedback:$("#scoreFeedback").value.trim()});save();closeModal();render();toast("Результат сохранён")}
function resetDemo(){if(!confirm("Вернуть исходные демонстрационные данные? Ваши изменения будут удалены."))return;localStorage.removeItem("edugrade_state");state=load();render();toast("Демо-данные восстановлены")}
function render(){let views={dashboard,students:studentsPage,journal:journalPage,assessments:assessmentsPage,analytics:analyticsPage,student:studentPage};$("#content").innerHTML=views[currentPage]();if(currentPage==="dashboard")$("#content").insertAdjacentHTML("beforeend",`<div style="text-align:right;margin-top:22px"><button class="btn outline" onclick="resetDemo()">↺ Сбросить демо-данные</button></div>`)}
render();
</script>
</body>
</html>
